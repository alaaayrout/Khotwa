$kind: http-request
description: |-
  تسجيل دخول الشركة.

  **Response:**
  - `token` — استخدمه في طلبات الوظائف: `Authorization: CompanyToken {{company_token}}`
  - `data` — بيانات الشركة كاملة
url: "{{base_url}}/api/auth/company/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "company@example.com",
      "password": "securepass123"
    }
order: 3000
