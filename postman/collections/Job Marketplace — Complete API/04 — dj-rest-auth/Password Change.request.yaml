$kind: http-request
url: "{{base_url}}/api/auth/password/change/"
method: POST
headers:
  Content-Type: application/json
  Authorization: Token {{auth_token}}
body:
  type: text
  content: |-
    {
      "old_password": "securepass123",
      "new_password1": "newsecurepass123",
      "new_password2": "newsecurepass123"
    }
order: 6000
