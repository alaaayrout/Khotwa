$kind: collection
description: |-
  مجموعة Postman الشاملة لمشروع Job Marketplace.

  ## التطبيقات
  - **users** — المصادقة، التسجيل، القوائم العامة
  - **jobs** — الوظائف، التخصصات، عرض الوظائف
  - **dj-rest-auth** — إعادة تعيين كلمة المرور ومصادقة CustomUser

  ## المتغيرات
  | المتغير | الاستخدام |
  |---------|----------|
  | `base_url` | عنوان السيرفر (افتراضي: http://localhost:8000) |
  | `company_token` | يُملأ من **Company Login** — لطلبات الوظائف المحمية |
  | `auth_token` | يُملأ من **dj-rest-auth Login** — لطلبات CustomUser |
  | `job_id` | معرّف وظيفة للاختبار |
  | `specialization_id` | معرّف تخصص للاختبار |

  ## تدفقات الاختبار

  ### باحث عن عمل
  1. Register Job Seeker → 2. Verify OTP → 3. Login Job Seeker

  ### شركة
  1. Register Company → 2. Verify Company OTP → 3. موافقة الأدمن → 4. Company Login (يُرجع `token`)
  5. Create Job باستخدام `Authorization: CompanyToken {{company_token}}`

  ### عرض الوظائف (عام)
  - List Public Jobs / Get Job by ID — بدون مصادقة
variables:
  base_url: http://localhost:8000
  company_token: ""
  auth_token: ""
  job_id: "1"
  specialization_id: "1"
